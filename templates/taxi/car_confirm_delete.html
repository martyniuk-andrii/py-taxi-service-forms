{% extends 'base.html' %}
{% block content %}
  <p>Are you sure you want to delete this car: {{ car }}?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
  <br>
  <a href="{% url 'taxi:car-detail' car.id %}" class="btn btn-primary">
    Cancel
  </a>
{% endblock %}
